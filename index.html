<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeBox | Home</title>
    <link rel="stylesheet" href="assets/styles/styles.css" />
  </head>
  <body data-page="home">
    <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">RecipeBox</a>
        <div class="navbar-nav flex-row align-items-center gap-3">
          <a class="nav-link active" href="index.html">Home</a>
          <a id="nav-signin" class="nav-link" href="pages/signin.html">Sign in</a>
          <a id="nav-admin" class="nav-link d-none" href="pages/admin.html">Admin</a>
          <button id="nav-signout" type="button" class="btn btn-sm btn-outline-light d-none">Sign out</button>
          <span id="nav-user" class="text-white small">Guest</span>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <header class="text-center mb-4">
        <p class="eyebrow mb-2">Recipe tracking made simple</p>
        <h1 class="display-5">RecipeBox</h1>
        <p id="page-status" class="lead mb-2">Browse the recipe collection and sign in to manage records.</p>
      </header>

      <main>
        <section class="card mb-4 shadow-sm">
          <div class="card-header">
            <h2 class="h5 mb-0">Add or update a recipe</h2>
          </div>
          <div class="card-body">
            <form id="recipe-form">
              <input type="hidden" id="recipe-id" />
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="recipe-title" class="form-label">Recipe title</label>
                  <input id="recipe-title" class="form-control" type="text" required />
                </div>
                <div class="col-md-3">
                  <label for="recipe-category" class="form-label">Category</label>
                  <select id="recipe-category" class="form-select">
                    <option>Breakfast</option>
                    <option>Dinner</option>
                    <option>Dessert</option>
                    <option>Snacks</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label for="recipe-prep-time" class="form-label">Prep time</label>
                  <input id="recipe-prep-time" class="form-control" type="number" min="1" value="15" />
                </div>
              </div>

              <div class="row g-3 mt-1">
                <div class="col-md-6">
                  <label for="recipe-description" class="form-label">Description</label>
                  <textarea id="recipe-description" class="form-control" rows="3" required></textarea>
                </div>
                <div class="col-md-6">
                  <label for="recipe-image" class="form-label">Image URL</label>
                  <input id="recipe-image" class="form-control" type="url" placeholder="https://example.com/image.jpg" />
                </div>
              </div>

              <div class="row g-3 mt-1">
                <div class="col-md-3">
                  <label for="recipe-servings" class="form-label">Servings</label>
                  <input id="recipe-servings" class="form-control" type="number" min="1" value="2" />
                </div>
                <div class="col-md-9">
                  <label for="recipe-ingredients" class="form-label">Ingredients</label>
                  <textarea id="recipe-ingredients" class="form-control" rows="4" placeholder="One ingredient per line" required></textarea>
                </div>
              </div>

              <div class="mt-3">
                <label for="recipe-instructions" class="form-label">Instructions</label>
                <textarea id="recipe-instructions" class="form-control" rows="4" placeholder="One step per line" required></textarea>
              </div>

              <div class="d-flex flex-wrap gap-2 mt-3">
                <button id="recipe-submit-btn" type="submit" class="btn btn-primary">Add recipe</button>
                <button id="recipe-cancel-btn" type="button" class="btn btn-outline-secondary d-none">Cancel edit</button>
              </div>
              <p id="recipe-form-status" class="mt-3 mb-0 text-success" role="status"></p>
            </form>
          </div>
        </section>

        <section>
          <div id="recipe-list" class="row g-4"></div>
        </section>
      </main>

      <footer class="border-top mt-5 pt-4 text-center text-muted">
        <a href="https://github.com/delonzow" target="_blank" rel="noopener noreferrer" class="me-3">GitHub profile</a>
        <a href="https://github.com/delonzow/scaling-enigma-dev-delta" target="_blank" rel="noopener noreferrer">Source code</a>
      </footer>
    </div>

    <script src="assets/scripts/app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
