<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeBox | Sign In</title>
    <link rel="stylesheet" href="../assets/styles/styles.css" />
  </head>
  <body data-page="signin">
    <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">RecipeBox</a>
        <div class="navbar-nav flex-row align-items-center gap-3">
          <a class="nav-link" href="../index.html">Home</a>
          <a id="nav-admin" class="nav-link d-none" href="admin.html">Admin</a>
          <button id="nav-signout" type="button" class="btn btn-sm btn-outline-light d-none">Sign out</button>
          <span id="nav-user" class="text-white small">Guest</span>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-6 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-header">
              <h1 class="h4 mb-0">Sign in to RecipeBox</h1>
            </div>
            <div class="card-body">
              <form id="signin-form">
                <div class="mb-3">
                  <label for="signin-username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="signin-username" required />
                </div>
                <div class="mb-3">
                  <label for="signin-password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="signin-password" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
                <p id="signin-status" class="mt-3 mb-0" role="status"></p>
              </form>
            </div>
          </div>

          <div class="mt-4 card border-info bg-light">
            <div class="card-body">
              <h2 class="h6 text-info">Development test accounts</h2>
              <pre class="mb-0 small">ADMIN
username: admin
password: admin123

USER
username: user
password: user123</pre>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="border-top py-4 text-center text-muted">
      <a href="https://github.com/delonzow" target="_blank" rel="noopener noreferrer" class="me-3">GitHub profile</a>
      <a href="https://github.com/delonzow/scaling-enigma-dev-delta" target="_blank" rel="noopener noreferrer">Source code</a>
    </footer>

    <script src="../assets/scripts/app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
